services:
  postgres:
    image: postgres:17
    container_name: reservas-postgres
    environment:
      POSTGRES_DB: reservas_db
      POSTGRES_USER: reservas_usuario
      POSTGRES_PASSWORD: reservas_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data

volumes:
  postgres-datos: