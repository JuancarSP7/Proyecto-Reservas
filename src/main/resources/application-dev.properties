# Conexión al Postgres de Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/reservas_db
spring.datasource.username=reservas_usuario
spring.datasource.password=reservas_pass

# Las tablas las crea Flyway; Hibernate solo comprueba que coinciden con las entidades
spring.jpa.hibernate.ddl-auto=validate

# Muestra en consola las consultas SQL que lanza Hibernate (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true